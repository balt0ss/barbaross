name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Unit tests
        run: gradle --no-daemon :ipc:testDebugUnitTest
      - name: Assemble debug APKs
        run: gradle --no-daemon :ide:assembleDebug :runtime:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: barbaross-debug-apks
          path: |
            ide/build/outputs/apk/debug/*.apk
            runtime/build/outputs/apk/debug/*.apk
