name: Barbaross Build

on:
  push:
    paths:
      - 'barbaross-stage1.zip'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Barbaross IDE and Runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/barbaross-src"

          unzip -q barbaross-stage1.zip \
            -d "$RUNNER_TEMP/barbaross-src"

          if [ ! -f "$RUNNER_TEMP/barbaross-src/barbaross/gradlew" ]; then
            echo "ERROR: gradlew not found!"
            echo "ZIP structure:"
            find "$RUNNER_TEMP/barbaross-src" -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Build and test project
        working-directory: ${{ runner.temp }}/barbaross-src/barbaross
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew --no-daemon \
            :ipc:testDebugUnitTest \
            :ide:assembleDebug \
            :runtime:assembleDebug

      - name: Verify APK files
        shell: bash
        run: |
          IDE_APK="$RUNNER_TEMP/barbaross-src/barbaross/ide/build/outputs/apk/debug"
          RUNTIME_APK="$RUNNER_TEMP/barbaross-src/barbaross/runtime/build/outputs/apk/debug"

          echo "Checking IDE APK..."
          find "$IDE_APK" -name "*.apk" -type f

          echo "Checking Runtime APK..."
          find "$RUNTIME_APK" -name "*.apk" -type f

          test -n "$(find "$IDE_APK" -name '*.apk' -type f -print -quit)"
          test -n "$(find "$RUNTIME_APK" -name '*.apk' -type f -print -quit)"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: barbaross-debug-apks
          path: |
            ${{ runner.temp }}/barbaross-src/barbaross/ide/build/outputs/apk/debug/*.apk
            ${{ runner.temp }}/barbaross-src/barbaross/runtime/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
