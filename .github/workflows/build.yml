name: Barbaross Build

on:
  push:
    paths:
      - 'barbaross-stage1.zip'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Barbaross IDE (single APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Extract project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/barbaross-src"

          unzip -q barbaross-stage1.zip \
            -d "$RUNNER_TEMP/barbaross-src"

          if [ ! -f "$RUNNER_TEMP/barbaross-src/barbaross/gradlew" ]; then
            echo "ERROR: gradlew not found!"
            echo "ZIP structure:"
            find "$RUNNER_TEMP/barbaross-src" -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Build and test project
        working-directory: ${{ runner.temp }}/barbaross-src/barbaross
        shell: bash
        run: |
          chmod +x gradlew

          ./gradlew --no-daemon \
            :ipc:testDebugUnitTest \
            :ide:assembleDebug

          mkdir -p "$RUNNER_TEMP/apks"
          cp ide/build/outputs/apk/debug/ide-debug.apk "$RUNNER_TEMP/apks/barbaross-target36.apk"

          # Экспериментальная копия: targetSdk 28, applicationId dev.barbaross.ide.t28 (ставится рядом).
          ./gradlew --no-daemon -Pbarbaross.targetSdk=28 :ide:assembleDebug
          cp ide/build/outputs/apk/debug/ide-debug.apk "$RUNNER_TEMP/apks/barbaross-target28.apk"

      - name: Verify APK files
        shell: bash
        run: |
          SRC="$RUNNER_TEMP/barbaross-src/barbaross"
          IDE_APK_DIR="$RUNNER_TEMP/apks"

          echo "Checking IDE APK..."
          find "$IDE_APK_DIR" -name "*.apk" -type f
          test "$(find "$IDE_APK_DIR" -name '*.apk' | wc -l)" -eq 2
          APK="$IDE_APK_DIR/barbaross-target36.apk"

          echo "Checking that Runtime is merged into the IDE APK..."
          AAPT=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest.txt"
          grep -q 'dev.barbaross.runtime.BuildService' "$RUNNER_TEMP/manifest.txt"
          grep -q ':build' "$RUNNER_TEMP/manifest.txt"
          "$AAPT" dump badging "$IDE_APK_DIR/barbaross-target28.apk" | grep -E "package:|targetSdkVersion"

          echo "Checking that no separate Runtime APK exists..."
          test ! -d "$SRC/runtime/build/outputs/apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: barbaross-debug-apks
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error
          retention-days: 7
