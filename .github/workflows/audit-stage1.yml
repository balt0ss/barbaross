name: Barbaross Stage 1 Audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract and inventory project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, zipfile, hashlib

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          archive = root / "barbaross-stage1.zip"
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "barbaross-project"
          out.mkdir(parents=True, exist_ok=True)

          if not archive.is_file():
              raise SystemExit("ZIP not found")

          with zipfile.ZipFile(archive) as z:
              base = out.resolve()
              for info in z.infolist():
                  target = (out / info.filename).resolve()
                  if target != base and base not in target.parents:
                      raise SystemExit(f"Unsafe ZIP path: {info.filename}")
                  z.extract(info, out)

          report = [
              "BARBAROSS STAGE 1 AUDIT",
              f"Archive size: {archive.stat().st_size}",
              f"SHA256: {hashlib.sha256(archive.read_bytes()).hexdigest()}"
          ]

          files = sorted(p for p in out.rglob("*") if p.is_file())
          report += ["", f"Extracted files: {len(files)}", "FILE TREE"]

          for p in files:
              report.append(f"{p.relative_to(out)} ({p.stat().st_size} bytes)")

          report += ["", "BUILD CONFIGURATION"]

          candidates = [
              p for p in files
              if p.name in {
                  "settings.gradle", "settings.gradle.kts",
                  "build.gradle", "build.gradle.kts",
                  "gradle.properties", "gradle-wrapper.properties",
                  "libs.versions.toml", "AndroidManifest.xml"
              } or p.suffix in {".gradle", ".kts"}
          ]

          for p in candidates:
              try:
                  data = p.read_text(encoding="utf-8")
              except Exception:
                  continue
              report += ["", f"FILE: {p.relative_to(out)}", data[:30000]]

          (out / "BARBAROSS_AUDIT.txt").write_text(
              "\n".join(report), encoding="utf-8"
          )
          print("\n".join(report[:100]))
          PY

          echo "AUDIT_DIR=$RUNNER_TEMP/barbaross-project" >> "$GITHUB_ENV"

      - name: Publish extracted project
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch="barbaross-audit-${GITHUB_RUN_NUMBER}"
          temp_repo="$RUNNER_TEMP/audit-repo"

          mkdir -p "$temp_repo"
          cp -a "$AUDIT_DIR/." "$temp_repo/"

          git -C "$temp_repo" init -b "$branch"
          git -C "$temp_repo" config user.name "github-actions[bot]"
          git -C "$temp_repo" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$temp_repo" add -A
          git -C "$temp_repo" commit -m "Create temporary Barbaross source audit"

          git -C "$temp_repo" remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git -C "$temp_repo" push origin "HEAD:refs/heads/$branch"

          echo "Audit branch: $branch" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: barbaross-stage1-audit
          path: ${{ runner.temp }}/barbaross-project/
          if-no-files-found: warn
          retention-days: 7
